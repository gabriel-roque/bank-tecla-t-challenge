name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Ledger.slnx

      - name: Format
        run: dotnet format Ledger.slnx --verify-no-changes --no-restore

      - name: Build without warnings
        run: dotnet build Ledger.slnx -c Release --no-restore

      - name: Audit NuGet dependencies
        run: dotnet list Ledger.slnx package --vulnerable --include-transitive

      - name: Unit and integration tests
        run: dotnet test Ledger.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Validate Compose
        run: docker compose config --quiet

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Validate AsyncAPI
        run: npx --yes @asyncapi/cli@6.3.0 validate docs/asyncapi.yaml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  gatling-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests-performance/gatling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests-performance/gatling/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --audit-level=high

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: ledger-api
            dockerfile: src/Ledger.Api/Dockerfile
          - name: query-api
            dockerfile: src/Query.Api/Dockerfile
          - name: ledger-worker
            dockerfile: src/Ledger.Worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: resilient-ledger/${{ matrix.name }}:ci
