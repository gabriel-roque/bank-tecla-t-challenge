name: resilient-ledger

x-ledger-api: &ledger-api
  build:
    context: .
    dockerfile: src/Ledger.Api/Dockerfile
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_URLS: http://+:8080
    ConnectionStrings__Ledger: Host=ledger-db-primary,ledger-db-standby;Port=5432;Database=ledger;Username=ledger_app;Password=${LEDGER_APP_PASSWORD:-ledger_app_dev};Target Session Attributes=read-write;Load Balance Hosts=true;Timeout=3;Command Timeout=5;Maximum Pool Size=40
    Jwt__Issuer: ledger-local
    Jwt__Audience: ledger-api
    Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-me-123456789}
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 20

x-query-api: &query-api
  build:
    context: .
    dockerfile: src/Query.Api/Dockerfile
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_URLS: http://+:8080
    ConnectionStrings__Read: Host=read-db;Port=5432;Database=ledger_read;Username=read_query;Password=${READ_QUERY_PASSWORD:-read_query_dev};Timeout=3;Command Timeout=5;Maximum Pool Size=50
    ConnectionStrings__LedgerReadOnly: Host=ledger-db-primary,ledger-db-standby;Port=5432;Database=ledger;Username=ledger_query;Password=${LEDGER_QUERY_PASSWORD:-ledger_query_dev};Target Session Attributes=read-write;Load Balance Hosts=true;Timeout=3;Command Timeout=5;Maximum Pool Size=10
    Jwt__Issuer: ledger-local
    Jwt__Audience: ledger-api
    Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-me-123456789}
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 20

x-worker: &worker
  build:
    context: .
    dockerfile: src/Ledger.Worker/Dockerfile
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_URLS: http://+:8080
    ConnectionStrings__Ledger: Host=ledger-db-primary,ledger-db-standby;Port=5432;Database=ledger;Username=ledger_worker;Password=${LEDGER_WORKER_PASSWORD:-ledger_worker_dev};Target Session Attributes=read-write;Load Balance Hosts=true;Timeout=3;Command Timeout=5;Maximum Pool Size=10
    ConnectionStrings__Read: Host=read-db;Port=5432;Database=ledger_read;Username=read_projector;Password=${READ_PROJECTOR_PASSWORD:-read_projector_dev};Timeout=3;Command Timeout=5;Maximum Pool Size=20
    Kafka__BootstrapServers: kafka-1:9092,kafka-2:9092,kafka-3:9092
    Kafka__GroupId: account-balance-projection-v1
    Outbox__BatchSize: 32
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 20

x-kafka-environment: &kafka-environment
  KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

services:
  ledger-db-primary:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-ledger_admin_dev}
      LEDGER_REPLICATION_PASSWORD: ${LEDGER_REPLICATION_PASSWORD:-replication_dev}
      LEDGER_APP_PASSWORD: ${LEDGER_APP_PASSWORD:-ledger_app_dev}
      LEDGER_WORKER_PASSWORD: ${LEDGER_WORKER_PASSWORD:-ledger_worker_dev}
      LEDGER_QUERY_PASSWORD: ${LEDGER_QUERY_PASSWORD:-ledger_query_dev}
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10", "-c", "max_connections=150"]
    volumes:
      - ledger-primary-data:/var/lib/postgresql/data
      - ./infra/postgres-ledger/01-create-roles.sh:/docker-entrypoint-initdb.d/01-create-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_admin -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 30

  ledger-db-standby:
    image: postgres:17-alpine
    user: postgres
    environment:
      PGDATA: /var/lib/postgresql/data
      PGAPPNAME: ledger_standby
      LEDGER_REPLICATION_PASSWORD: ${LEDGER_REPLICATION_PASSWORD:-replication_dev}
    entrypoint: ["sh", "/standby-entrypoint.sh"]
    volumes:
      - ledger-standby-data:/var/lib/postgresql/data
      - ./infra/postgres-ledger/standby-entrypoint.sh:/standby-entrypoint.sh:ro
    depends_on:
      ledger-db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_admin -d ledger && test \"$(psql -U ledger_admin -d ledger -tAc 'SELECT pg_is_in_recovery()')\" = t"]
      interval: 5s
      timeout: 3s
      retries: 30

  ledger-sync-config:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:-ledger_admin_dev}
    command:
      - sh
      - -ec
      - >-
        psql -h ledger-db-primary -U ledger_admin -d ledger -c
        "ALTER SYSTEM SET synchronous_standby_names = 'ledger_standby'" &&
        psql -h ledger-db-primary -U ledger_admin -d ledger -c
        "ALTER SYSTEM SET synchronous_commit = 'on'" &&
        psql -h ledger-db-primary -U ledger_admin -d ledger -c
        "SELECT pg_reload_conf()"
    depends_on:
      ledger-db-primary:
        condition: service_healthy
      ledger-db-standby:
        condition: service_healthy
    restart: "no"

  read-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger_read
      POSTGRES_USER: read_admin
      POSTGRES_PASSWORD: ${READ_ADMIN_PASSWORD:-read_admin_dev}
      READ_PROJECTOR_PASSWORD: ${READ_PROJECTOR_PASSWORD:-read_projector_dev}
      READ_QUERY_PASSWORD: ${READ_QUERY_PASSWORD:-read_query_dev}
    command: ["postgres", "-c", "max_connections=150"]
    volumes:
      - read-data:/var/lib/postgresql/data
      - ./infra/postgres-read/01-create-roles.sh:/docker-entrypoint-initdb.d/01-create-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U read_admin -d ledger_read"]
      interval: 3s
      timeout: 3s
      retries: 30

  kafka-1:
    image: apache/kafka:4.0.0
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes:
      - kafka-1-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-2:
    image: apache/kafka:4.0.0
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes:
      - kafka-2-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-3:
    image: apache/kafka:4.0.0
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes:
      - kafka-3-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:4.0.0
    command: ["sh", "/kafka-init/init.sh"]
    volumes:
      - ./infra/kafka:/kafka-init:ro
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: "no"

  ledger-migrator:
    build:
      context: .
      dockerfile: src/Ledger.Api/Dockerfile
    environment:
      MigrateOnly: "true"
      ConnectionStrings__Ledger: Host=ledger-db-primary;Port=5432;Database=ledger;Username=ledger_admin;Password=${POSTGRES_ADMIN_PASSWORD:-ledger_admin_dev}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-me-123456789}
    depends_on:
      ledger-sync-config:
        condition: service_completed_successfully
    restart: "no"

  read-migrator:
    build:
      context: .
      dockerfile: src/Ledger.Worker/Dockerfile
    environment:
      MigrateOnly: "true"
      ConnectionStrings__Ledger: Host=ledger-db-primary;Port=5432;Database=ledger;Username=ledger_admin;Password=${POSTGRES_ADMIN_PASSWORD:-ledger_admin_dev}
      ConnectionStrings__Read: Host=read-db;Port=5432;Database=ledger_read;Username=read_admin;Password=${READ_ADMIN_PASSWORD:-read_admin_dev}
      Kafka__BootstrapServers: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      read-db:
        condition: service_healthy
    restart: "no"

  ledger-api-1:
    <<: *ledger-api
    depends_on:
      ledger-migrator:
        condition: service_completed_successfully

  ledger-api-2:
    <<: *ledger-api
    depends_on:
      ledger-migrator:
        condition: service_completed_successfully

  query-api-1:
    <<: *query-api
    depends_on:
      ledger-migrator:
        condition: service_completed_successfully
      read-migrator:
        condition: service_completed_successfully

  query-api-2:
    <<: *query-api
    depends_on:
      ledger-migrator:
        condition: service_completed_successfully
      read-migrator:
        condition: service_completed_successfully

  ledger-worker-1:
    <<: *worker
    depends_on:
      ledger-migrator:
        condition: service_completed_successfully
      read-migrator:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  ledger-worker-2:
    <<: *worker
    depends_on:
      ledger-migrator:
        condition: service_completed_successfully
      read-migrator:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  edge:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ledger-api-1:
        condition: service_healthy
      ledger-api-2:
        condition: service_healthy
      query-api-1:
        condition: service_healthy
      query-api-2:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ledger-primary-data:
  ledger-standby-data:
  read-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
