events {
    worker_connections 16384;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream ledger_api {
        zone ledger_api 64k;
        least_conn;
        server ledger-api-1:8080 resolve max_fails=2 fail_timeout=5s;
        server ledger-api-2:8080 resolve max_fails=2 fail_timeout=5s;
        keepalive 128;
    }

    upstream query_api {
        zone query_api 64k;
        least_conn;
        server query-api-1:8080 resolve max_fails=2 fail_timeout=5s;
        server query-api-2:8080 resolve max_fails=2 fail_timeout=5s;
        keepalive 256;
    }

    limit_req_zone $binary_remote_addr zone=ledger_write:10m rate=5000r/s;
    limit_req_zone $binary_remote_addr zone=ledger_read:10m rate=10000r/s;
    limit_req_status 429;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 64k;

        location ~ ^/v1/accounts/[0-9a-fA-F-]+/movements$ {
            limit_except POST { deny all; }
            limit_req zone=ledger_write burst=1000 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 1s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_504 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_pass http://ledger_api;
        }

        location /v1/ {
            limit_except GET { deny all; }
            limit_req zone=ledger_read burst=2000 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 1s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 2;
            proxy_pass http://query_api;
        }

        location /docs/ledger/ {
            proxy_pass http://ledger_api;
        }

        location /docs/query/ {
            proxy_pass http://query_api;
        }

        location = /health/live {
            access_log off;
            return 200 '{"status":"live"}';
            add_header Content-Type application/json;
        }
    }
}
