<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Escrita segura - concorrência e idempotência</title>
  <desc id="desc">Duas movimentações simultâneas disputam a mesma sequência; uma vence, a outra recarrega e revalida. Retries usam a mesma chave de idempotência.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 14 7 0 14Z" fill="#64748b"/></marker>
    <marker id="ok" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 14 7 0 14Z" fill="#34d399"/></marker>
    <marker id="warn" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 14 7 0 14Z" fill="#f59e0b"/></marker>
    <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.title{font-size:34px;font-weight:750;fill:#f8fafc}.subtitle{font-size:15px;fill:#93c5fd}.cap{font-size:12.5px;font-weight:700;letter-spacing:1.2px;fill:#94a3b8}.h{font-size:18px;font-weight:700;fill:#f8fafc}.t{font-size:14px;fill:#cbd5e1}.m{font-family:"SFMono-Regular",Consolas,monospace;font-size:12.5px;font-weight:650;fill:#e2e8f0}.p{font-size:11px;font-weight:700;fill:#dbeafe}.line{fill:none;stroke:#64748b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.green{fill:none;stroke:#34d399;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#ok)}.amber{fill:none;stroke:#f59e0b;stroke-width:3;stroke-dasharray:8 7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#warn)}</style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/><rect x="20" y="20" width="1560" height="860" rx="34" fill="#0f172a"/>
  <text x="72" y="78" class="title">Escrita segura — concorrência e idempotência</text><text x="72" y="108" class="subtitle">A sequência protege o saldo; a chave de idempotência torna retry e timeout determinísticos</text>

  <rect x="60" y="130" width="1480" height="335" rx="25" fill="#111c31" stroke="#334155"/>
  <rect x="82" y="146" width="380" height="28" rx="14" fill="#172554"/>
  <text x="272" y="165" text-anchor="middle" class="cap">CONCORRÊNCIA · MESMA CONTA</text>
  <text x="486" y="165" class="t">versão inicial = 10</text>
  <path d="M272 245H348" class="line"/><path d="M272 375H348" class="line"/><path d="M585 245H713" class="green"/><path d="M585 375H713" class="amber"/>

  <g><rect x="72" y="200" width="200" height="90" rx="17" fill="#1b2838" stroke="#60a5fa"/><circle cx="105" cy="234" r="15" fill="#1d4ed8"/><text x="105" y="239" text-anchor="middle" class="p">A</text><text x="132" y="236" class="h">Movimento A</text><text x="94" y="268" class="m">débito · R$ 40</text></g>
  <g><rect x="72" y="330" width="200" height="90" rx="17" fill="#1b2838" stroke="#f59e0b"/><circle cx="105" cy="364" r="15" fill="#b45309"/><text x="105" y="369" text-anchor="middle" class="p">B</text><text x="132" y="366" class="h">Movimento B</text><text x="94" y="398" class="m">débito · R$ 70</text></g>

  <g><rect x="355" y="192" width="230" height="105" rx="18" fill="#1b2838" stroke="#60a5fa" stroke-width="2"/><text x="383" y="229" class="h">Ledger API · 1</text><text x="383" y="256" class="t">carrega account_version</text><rect x="383" y="268" width="118" height="23" rx="12" fill="#172554"/><text x="442" y="284" text-anchor="middle" class="p">expected = 10</text></g>
  <g><rect x="355" y="322" width="230" height="105" rx="18" fill="#1b2838" stroke="#60a5fa" stroke-width="2"/><text x="383" y="359" class="h">Ledger API · 2</text><text x="383" y="386" class="t">carrega account_version</text><rect x="383" y="398" width="118" height="23" rx="12" fill="#172554"/><text x="442" y="414" text-anchor="middle" class="p">expected = 10</text></g>

  <g><rect x="720" y="180" width="370" height="260" rx="20" fill="#1b2838" stroke="#a78bfa" stroke-width="2"/><text x="752" y="220" class="h">PostgreSQL Ledger</text><text x="752" y="246" class="t">UNIQUE (account_id, sequence)</text><rect x="752" y="270" width="306" height="58" rx="13" fill="#052e2b" stroke="#10b981"/><circle cx="782" cy="299" r="14" fill="#047857"/><path d="m775 299 5 5 9-11" fill="none" stroke="#d1fae5" stroke-width="2.5"/><text x="808" y="296" class="m">A grava sequence = 11</text><text x="808" y="316" class="t">commit confirmado</text><rect x="752" y="346" width="306" height="66" rx="13" fill="#451a03" stroke="#f59e0b"/><circle cx="782" cy="379" r="14" fill="#b45309"/><text x="782" y="384" text-anchor="middle" class="p">!</text><text x="808" y="376" class="m">B encontra conflito</text><text x="808" y="398" class="t">recarrega · revalida · retry curto</text></g>

  <path d="M1090 379H1155V305H1208" class="amber"/>
  <g><rect x="1215" y="210" width="295" height="190" rx="20" fill="#1b2838" stroke="#f59e0b" stroke-width="2"/><text x="1245" y="248" class="h">Revalidação de saldo</text><text x="1245" y="281" class="t">A já alterou o agregado</text><rect x="1245" y="302" width="235" height="42" rx="12" fill="#451a03"/><text x="1362" y="328" text-anchor="middle" class="m">saldo nunca fica negativo</text><text x="1245" y="372" class="t">confirma ou rejeita com segurança</text></g>

  <rect x="60" y="485" width="1480" height="265" rx="25" fill="#111c31" stroke="#334155"/>
  <rect x="82" y="501" width="348" height="28" rx="14" fill="#083344"/>
  <text x="256" y="520" text-anchor="middle" class="cap">IDEMPOTÊNCIA · RETRY SEGURO</text>
  <text x="454" y="520" class="t">timeout depois do commit não duplica a movimentação</text>
  <path d="M287 618H383" class="line"/><path d="M630 618H723" class="green"/><path d="M970 618H1073" class="amber"/><path d="M1080 670H1035V720H510V683" class="green"/><text x="774" y="713" text-anchor="middle" class="p">retry com a mesma K1</text>

  <g><rect x="72" y="560" width="215" height="116" rx="18" fill="#1b2838" stroke="#22d3ee" stroke-width="2"/><text x="100" y="599" class="h">Cliente</text><text x="100" y="626" class="m">Idempotency-Key: K1</text><text x="100" y="652" class="t">envia uma única intenção</text></g>
  <g><rect x="390" y="560" width="240" height="116" rx="18" fill="#1b2838" stroke="#60a5fa" stroke-width="2"/><text x="418" y="599" class="h">Ledger API</text><text x="418" y="626" class="t">hash do comando + resposta</text><text x="418" y="652" class="m">mesma transação ACID</text></g>
  <g><rect x="730" y="545" width="240" height="146" rx="18" fill="#1b2838" stroke="#34d399" stroke-width="2"/><text x="758" y="585" class="h">Commit</text><text x="758" y="612" class="t">evento · idempotência · Outbox</text><rect x="758" y="632" width="184" height="32" rx="16" fill="#052e2b"/><text x="850" y="653" text-anchor="middle" class="p">TUDO OU NADA</text></g>
  <g><rect x="1080" y="545" width="430" height="146" rx="18" fill="#1b2838" stroke="#f59e0b" stroke-width="2"/><text x="1110" y="585" class="h">Resposta perdida / timeout</text><text x="1110" y="614" class="t">cliente repete K1 com o mesmo comando</text><rect x="1110" y="635" width="370" height="32" rx="16" fill="#172554"/><text x="1295" y="656" text-anchor="middle" class="m">API devolve a resposta original · sem duplicar</text></g>

  <rect x="60" y="765" width="1480" height="80" rx="25" fill="#111c31" stroke="#334155"/>
  <rect x="214" y="776" width="1172" height="54" rx="27" fill="#064e3b" stroke="#34d399"/><circle cx="257" cy="803" r="15" fill="#10b981"/><path d="m250 803 5 5 9-11" fill="none" stroke="#ecfdf5" stroke-width="2.5"/><text x="800" y="809" text-anchor="middle" class="h">Uma intenção financeira produz no máximo uma movimentação confirmada</text>
</svg>
