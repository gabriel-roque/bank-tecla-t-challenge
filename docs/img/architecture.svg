<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ledger financeiro resiliente - fluxos síncrono e assíncrono</title>
  <desc id="desc">Arquitetura Event Sourcing e CQRS organizada em processamento síncrono para comandos e consultas e processamento assíncrono com Outbox, Kafka e projeção.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 14 7 0 14Z" fill="#64748b"/></marker>
    <marker id="arrowCyan" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 14 7 0 14Z" fill="#22d3ee"/></marker>
    <marker id="arrowViolet" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 14 7 0 14Z" fill="#a78bfa"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity=".28"/></filter>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif}.title{font-size:34px;font-weight:750;fill:#f8fafc}.subtitle{font-size:15px;fill:#93c5fd}.section{font-size:12px;font-weight:750;letter-spacing:1.4px;fill:#94a3b8}.h{font-size:18px;font-weight:700;fill:#f8fafc}.t{font-size:13px;fill:#cbd5e1}.m{font-family:"SFMono-Regular",Consolas,monospace;font-size:11.5px;font-weight:650;fill:#e2e8f0}.p{font-size:11px;font-weight:700;fill:#dbeafe}.sync{fill:none;stroke:#64748b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.async{fill:none;stroke:#22d3ee;stroke-width:3;stroke-dasharray:9 7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowCyan)}.strong{fill:none;stroke:#a78bfa;stroke-width:2.5;stroke-dasharray:6 7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowViolet)}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#fff"/>
  <rect x="20" y="20" width="1560" height="960" rx="34" fill="#0f172a"/>
  <text x="72" y="78" class="title">Ledger financeiro resiliente — componentes e fluxos</text>
  <text x="72" y="108" class="subtitle">Event Sourcing no Ledger · CQRS · Outbox transacional · leitura projetada e forte</text>

  <!-- Faixa síncrona -->
  <rect x="60" y="135" width="1480" height="400" rx="25" fill="#111c31" stroke="#334155"/>
  <rect x="82" y="152" width="238" height="28" rx="14" fill="#172554"/>
  <text x="201" y="171" text-anchor="middle" class="section" fill="#bfdbfe">PROCESSAMENTO SÍNCRONO</text>
  <text x="342" y="171" class="t">requisição → resposta no mesmo fluxo HTTP</text>

  <!-- Setas síncronas: camada atrás dos cards e término antes da borda -->
  <path d="M270 282H323" class="sync"/>
  <path d="M550 245H633" class="sync"/>
  <path d="M550 315H590V435H633" class="sync"/>
  <path d="M910 245H993" class="sync"/>
  <path d="M910 435H993" class="sync"/>
  <path d="M910 390H955V315H993" class="strong"/>

  <!-- Clientes -->
  <g filter="url(#shadow)">
    <rect x="90" y="222" width="180" height="120" rx="18" fill="#1b2838" stroke="#334155"/>
    <circle cx="126" cy="262" r="18" fill="#075985"/><path d="M117 262h18M126 253v18" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <text x="155" y="267" class="h">Clientes</text>
    <text x="112" y="302" class="t">Aplicação · backoffice</text>
    <text x="112" y="325" class="t">Parceiros internos</text>
  </g>

  <!-- Nginx -->
  <g filter="url(#shadow)">
    <rect x="330" y="207" width="220" height="150" rx="20" fill="#1b2838" stroke="#22d3ee" stroke-width="2"/>
    <text x="440" y="249" text-anchor="middle" class="h">Nginx</text>
    <text x="440" y="277" text-anchor="middle" class="t">Gateway · Load Balancer</text>
    <rect x="348" y="299" width="184" height="31" rx="16" fill="#083344"/>
    <text x="440" y="320" text-anchor="middle" class="m">rate_limit · least_conn</text>
  </g>

  <!-- Ledger API -->
  <g filter="url(#shadow)">
    <rect x="640" y="190" width="270" height="150" rx="20" fill="#1b2838" stroke="#60a5fa" stroke-width="2"/>
    <text x="668" y="228" class="h">Ledger API</text>
    <rect x="828" y="206" width="52" height="25" rx="13" fill="#1d4ed8"/><text x="854" y="223" text-anchor="middle" class="p">2×</text>
    <text x="668" y="256" class="t">Command adapter · .NET</text>
    <rect x="668" y="276" width="184" height="43" rx="12" fill="#172554" stroke="#3b82f6"/>
    <text x="760" y="294" text-anchor="middle" class="m">idempotência</text><text x="760" y="311" text-anchor="middle" class="m">expected_version</text>
  </g>

  <!-- PostgreSQL Ledger -->
  <g filter="url(#shadow)">
    <rect x="1000" y="190" width="440" height="170" rx="20" fill="#1b2838" stroke="#a78bfa" stroke-width="2"/>
    <g transform="translate(1034 218)">
      <path d="M0 12v44c0 7 13 12 30 12s30-5 30-12V12Z" fill="#4c1d95" stroke="#c4b5fd" stroke-width="2"/>
      <ellipse cx="30" cy="12" rx="30" ry="12" fill="#6d28d9" stroke="#c4b5fd" stroke-width="2"/>
      <path d="M0 34c0 7 13 12 30 12s30-5 30-12M0 55c0 7 13 12 30 12s30-5 30-12" fill="none" stroke="#c4b5fd" stroke-width="2"/>
    </g>
    <text x="1118" y="236" class="h">PostgreSQL Ledger</text>
    <text x="1118" y="263" class="t">fonte imutável da verdade</text>
    <rect x="1118" y="281" width="132" height="30" rx="12" fill="#241c3b" stroke="#8b5cf6"/><text x="1184" y="301" text-anchor="middle" class="m">primary</text>
    <rect x="1262" y="281" width="148" height="30" rx="12" fill="#241c3b" stroke="#8b5cf6"/><text x="1336" y="301" text-anchor="middle" class="m">standby sync</text>
    <text x="1118" y="333" class="m">events · snapshots · idempotency · outbox</text>
  </g>

  <!-- Query API -->
  <g filter="url(#shadow)">
    <rect x="640" y="365" width="270" height="140" rx="20" fill="#1b2838" stroke="#60a5fa" stroke-width="2"/>
    <text x="668" y="404" class="h">Query API</text>
    <rect x="828" y="381" width="52" height="25" rx="13" fill="#1d4ed8"/><text x="854" y="398" text-anchor="middle" class="p">2×</text>
    <text x="668" y="432" class="t">Read adapter · .NET</text>
    <text x="668" y="462" class="m">saldo · histórico · extrato</text>
    <rect x="668" y="474" width="184" height="22" rx="11" fill="#172554"/><text x="760" y="490" text-anchor="middle" class="p">eventual + strong opcional</text>
  </g>

  <!-- PostgreSQL Read -->
  <g filter="url(#shadow)">
    <rect x="1000" y="380" width="440" height="125" rx="20" fill="#1b2838" stroke="#a78bfa" stroke-width="2"/>
    <g transform="translate(1034 405) scale(.72)">
      <path d="M0 12v44c0 7 13 12 30 12s30-5 30-12V12Z" fill="#4c1d95" stroke="#c4b5fd" stroke-width="2.6"/>
      <ellipse cx="30" cy="12" rx="30" ry="12" fill="#6d28d9" stroke="#c4b5fd" stroke-width="2.6"/>
      <path d="M0 34c0 7 13 12 30 12s30-5 30-12M0 55c0 7 13 12 30 12s30-5 30-12" fill="none" stroke="#c4b5fd" stroke-width="2.6"/>
    </g>
    <text x="1095" y="418" class="h">PostgreSQL Read</text>
    <text x="1095" y="445" class="t">projeção reconstruível</text>
    <text x="1095" y="476" class="m">balances · statements · processed_events</text>
  </g>

  <rect x="305" y="190" width="82" height="23" rx="12" fill="#111c31" stroke="#334155"/><text x="346" y="206" text-anchor="middle" class="p">HTTP</text>
  <rect x="930" y="201" width="76" height="23" rx="12" fill="#111c31" stroke="#334155"/><text x="968" y="217" text-anchor="middle" class="p">ACID</text>
  <rect x="910" y="398" width="106" height="23" rx="12" fill="#111c31" stroke="#334155"/><text x="963" y="414" text-anchor="middle" class="p">READ MODEL</text>
  <rect x="919" y="337" width="124" height="23" rx="12" fill="#241c3b"/><text x="981" y="353" text-anchor="middle" class="p">STRONG READ</text>

  <!-- Faixa assíncrona -->
  <rect x="60" y="560" width="1480" height="275" rx="25" fill="#111c31" stroke="#334155"/>
  <rect x="82" y="577" width="255" height="28" rx="14" fill="#083344"/>
  <text x="209" y="596" text-anchor="middle" class="section" fill="#a5f3fc">PROCESSAMENTO ASSÍNCRONO</text>
  <text x="360" y="596" class="t">commit já confirmado · entrega pelo menos uma vez</text>

  <!-- Setas assíncronas: fluxo linear -->
  <path d="M315 700H373" class="async"/><path d="M620 700H683" class="async"/><path d="M910 700H973" class="async"/><path d="M1220 700H1273" class="async"/>

  <g filter="url(#shadow)">
    <rect x="90" y="642" width="225" height="116" rx="18" fill="#1b2838" stroke="#a78bfa" stroke-width="2"/>
    <text x="118" y="680" class="h">Ledger · Outbox</text>
    <text x="118" y="708" class="t">mensagens pendentes</text>
    <rect x="118" y="724" width="169" height="22" rx="11" fill="#241c3b"/><text x="202" y="740" text-anchor="middle" class="p">durável no mesmo commit</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="380" y="630" width="240" height="140" rx="18" fill="#1b2838" stroke="#34d399" stroke-width="2"/>
    <text x="408" y="670" class="h">Worker · Publisher</text>
    <text x="408" y="698" class="t">menor sequência por conta</text>
    <rect x="408" y="720" width="88" height="28" rx="12" fill="#052e2b"/><text x="452" y="739" text-anchor="middle" class="m">worker-1</text>
    <rect x="506" y="720" width="86" height="28" rx="12" fill="#052e2b"/><text x="549" y="739" text-anchor="middle" class="m">worker-2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="690" y="630" width="220" height="140" rx="18" fill="#1b2838" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="731" cy="673" r="22" fill="#451a03" stroke="#f59e0b" stroke-width="2"/><path d="M720 665h22M720 673h22M720 681h22" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <text x="768" y="679" class="h">Kafka</text>
    <text x="718" y="716" class="t">partição por account_id</text>
    <text x="718" y="744" class="m">acks=all · RF=2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="980" y="630" width="240" height="140" rx="18" fill="#1b2838" stroke="#34d399" stroke-width="2"/>
    <text x="1008" y="670" class="h">Worker · Consumer</text>
    <text x="1008" y="698" class="t">valida sequência e Inbox</text>
    <rect x="1008" y="720" width="184" height="28" rx="14" fill="#052e2b"/><text x="1100" y="739" text-anchor="middle" class="m">idempotente · replay</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1280" y="642" width="225" height="116" rx="18" fill="#1b2838" stroke="#a78bfa" stroke-width="2"/>
    <text x="1308" y="680" class="h">Read Model</text>
    <text x="1308" y="708" class="t">saldo e extrato atualizados</text>
    <rect x="1308" y="724" width="169" height="22" rx="11" fill="#241c3b"/><text x="1392" y="740" text-anchor="middle" class="p">eventualmente consistente</text>
  </g>

  <!-- Rodapé -->
  <rect x="60" y="860" width="1480" height="78" rx="20" fill="#111c31" stroke="#334155"/>
  <line x1="92" y1="886" x2="146" y2="886" class="sync"/><text x="165" y="891" class="t">HTTP síncrono</text>
  <line x1="310" y1="886" x2="364" y2="886" class="async"/><text x="383" y="891" class="t">Outbox / eventos</text>
  <line x1="548" y1="886" x2="602" y2="886" class="strong"/><text x="621" y="891" class="t">leitura forte opcional</text>
  <rect x="875" y="873" width="190" height="29" rx="15" fill="#052e2b"/><text x="970" y="893" text-anchor="middle" class="p">ACID · Event Sourcing</text>
  <rect x="1077" y="873" width="190" height="29" rx="15" fill="#172554"/><text x="1172" y="893" text-anchor="middle" class="p">CQRS · idempotência</text>
  <rect x="1279" y="873" width="229" height="29" rx="15" fill="#241c3b"/><text x="1393" y="893" text-anchor="middle" class="p">ordem por conta · replay</text>
  <text x="92" y="920" class="m">Ledger = fonte da verdade · Read Model = derivado e reconstruível</text>
</svg>
