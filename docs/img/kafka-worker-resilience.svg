<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Resiliência assíncrona - Kafka e Workers</title>
  <desc id="desc">Três nós Kafka mantêm quórum, publicação e projeção durante a falha de um broker; o Outbox preserva eventos quando todo o cluster ou os Workers ficam indisponíveis.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 14 7 0 14Z" fill="#64748b"/></marker><marker id="cyan" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 14 7 0 14Z" fill="#22d3ee"/></marker><marker id="green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 14 7 0 14Z" fill="#34d399"/></marker>
    <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.title{font-size:34px;font-weight:750;fill:#f8fafc}.subtitle{font-size:15px;fill:#93c5fd}.cap{font-size:12.5px;font-weight:700;letter-spacing:1.2px;fill:#94a3b8}.h{font-size:18px;font-weight:700;fill:#f8fafc}.t{font-size:14px;fill:#cbd5e1}.m{font-family:"SFMono-Regular",Consolas,monospace;font-size:12.5px;font-weight:650;fill:#e2e8f0}.p{font-size:11px;font-weight:700;fill:#dbeafe}.line{fill:none;stroke:#64748b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.event{fill:none;stroke:#22d3ee;stroke-width:3;stroke-dasharray:9 7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#cyan)}.recover{fill:none;stroke:#34d399;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#green)}</style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/><rect x="20" y="20" width="1560" height="860" rx="34" fill="#0f172a"/>
  <text x="72" y="78" class="title">Resiliência assíncrona — Kafka e Workers</text><text x="72" y="108" class="subtitle">RF=3 · min ISR=2 · quórum KRaft 2/3 · falha de um broker sem interromper a projeção</text>
  <rect x="60" y="130" width="1480" height="200" rx="25" fill="#111c31" stroke="#334155"/>
  <rect x="82" y="140" width="298" height="28" rx="14" fill="#083344"/>
  <text x="231" y="159" text-anchor="middle" class="cap">PIPELINE NORMAL</text>
  <text x="404" y="159" class="t">Outbox → Kafka → projeção</text>

  <path d="M322 247H393" class="event"/><path d="M650 247H708" class="event"/><path d="M1065 247H1118" class="event"/>
  <g><rect x="72" y="190" width="250" height="120" rx="19" fill="#1b2838" stroke="#a78bfa" stroke-width="2"/><text x="100" y="228" class="h">PostgreSQL Ledger</text><text x="100" y="256" class="t">evento confirmado + Outbox</text><rect x="100" y="273" width="194" height="25" rx="13" fill="#241c3b"/><text x="197" y="290" text-anchor="middle" class="p">fonte da verdade</text></g>
  <g><rect x="400" y="180" width="250" height="140" rx="19" fill="#1b2838" stroke="#34d399" stroke-width="2"/><text x="428" y="219" class="h">Worker · Publisher</text><text x="428" y="247" class="t">lê pendências em ordem</text><rect x="428" y="269" width="88" height="30" rx="12" fill="#052e2b"/><text x="472" y="289" text-anchor="middle" class="m">worker-1</text><rect x="530" y="269" width="88" height="30" rx="12" fill="#052e2b"/><text x="574" y="289" text-anchor="middle" class="m">worker-2</text></g>
  <g><rect x="715" y="180" width="350" height="140" rx="19" fill="#1b2838" stroke="#f59e0b" stroke-width="2"/><text x="743" y="215" class="h">Kafka · KRaft</text><text x="743" y="242" class="t">RF=3 · acks=all · min ISR=2</text><rect x="743" y="269" width="90" height="30" rx="12" fill="#422006"/><text x="788" y="289" text-anchor="middle" class="m">broker-1</text><rect x="845" y="269" width="90" height="30" rx="12" fill="#422006"/><text x="890" y="289" text-anchor="middle" class="m">broker-2</text><rect x="947" y="269" width="90" height="30" rx="12" fill="#422006"/><text x="992" y="289" text-anchor="middle" class="m">broker-3</text></g>
  <g><rect x="1125" y="190" width="385" height="120" rx="19" fill="#1b2838" stroke="#a78bfa" stroke-width="2"/><text x="1153" y="228" class="h">PostgreSQL Read</text><text x="1153" y="256" class="t">projeção idempotente e reconstruível</text><text x="1153" y="287" class="m">processed_events ignora redelivery</text></g>

  <rect x="60" y="345" width="1480" height="320" rx="25" fill="#111c31" stroke="#334155"/>
  <rect x="82" y="361" width="250" height="28" rx="14" fill="#3f1d2e"/>
  <text x="207" y="380" text-anchor="middle" class="cap">CENÁRIOS DE FALHA</text>
  <text x="356" y="380" class="t">degradação explícita com dados preservados</text>
  <g><rect x="72" y="397" width="450" height="250" rx="20" fill="#1b2838" stroke="#34d399" stroke-width="2"/><circle cx="112" cy="438" r="18" fill="#047857"/><text x="112" y="444" text-anchor="middle" class="p">1</text><text x="145" y="444" class="h">Um broker Kafka morre</text><path d="M106 490h122" stroke="#64748b" stroke-width="3"/><circle cx="122" cy="490" r="15" fill="#451a03" stroke="#ef4444"/><path d="m114 482 16 16m0-16-16 16" stroke="#fca5a5" stroke-width="2.5"/><circle cx="166" cy="490" r="15" fill="#052e2b" stroke="#34d399"/><circle cx="210" cy="490" r="15" fill="#052e2b" stroke="#34d399"/><text x="105" y="535" class="t">• líderes afetados são reeleitos</text><text x="105" y="563" class="t">• quórum KRaft permanece em 2/3</text><text x="105" y="591" class="t">• publicação e projeção continuam</text><rect x="105" y="610" width="385" height="24" rx="12" fill="#064e3b"/><text x="297" y="627" text-anchor="middle" class="p">duas réplicas sincronizadas · serviço disponível</text></g>

  <g><rect x="575" y="397" width="450" height="250" rx="20" fill="#1b2838" stroke="#ef4444" stroke-width="2"/><circle cx="615" cy="438" r="18" fill="#b91c1c"/><text x="615" y="444" text-anchor="middle" class="p">2</text><text x="648" y="444" class="h">Todo o Kafka fica indisponível</text><rect x="608" y="476" width="360" height="42" rx="12" fill="#451a03"/><text x="788" y="502" text-anchor="middle" class="m">Outbox: 1 · 2 · 3 · 4 · … backlog</text><text x="608" y="549" class="t">• eventos confirmados continuam duráveis</text><text x="608" y="577" class="t">• Publisher aplica timeout e backoff</text><text x="608" y="605" class="t">• monitoramento aciona backpressure</text><rect x="608" y="610" width="384" height="24" rx="12" fill="#3f1d2e"/><text x="800" y="627" text-anchor="middle" class="p">Read Model fica atrasado · strong read preservada</text></g>

  <g><rect x="1078" y="397" width="432" height="250" rx="20" fill="#1b2838" stroke="#60a5fa" stroke-width="2"/><circle cx="1118" cy="438" r="18" fill="#1d4ed8"/><text x="1118" y="444" text-anchor="middle" class="p">3</text><text x="1151" y="444" class="h">Um Worker morre</text><rect x="1110" y="476" width="116" height="42" rx="12" fill="#3f1d2e" stroke="#ef4444"/><text x="1168" y="502" text-anchor="middle" class="m">worker-1 ×</text><path d="M1226 497H1267" class="line"/><rect x="1274" y="476" width="168" height="42" rx="12" fill="#052e2b" stroke="#10b981"/><text x="1358" y="502" text-anchor="middle" class="m">worker-2 assume</text><text x="1110" y="557" class="t">• Kafka rebalanceia as partições</text><text x="1110" y="585" class="t">• Outbox mantém pendências duráveis</text><text x="1110" y="613" class="t">• redelivery é absorvida pela Inbox</text></g>

  <rect x="60" y="690" width="1480" height="170" rx="25" fill="#111c31" stroke="#334155"/>
  <rect x="82" y="706" width="230" height="28" rx="14" fill="#052e2b"/>
  <text x="197" y="725" text-anchor="middle" class="cap">RECUPERAÇÃO</text>
  <text x="336" y="725" class="t">o mesmo mecanismo atende aos três cenários</text>
  <path d="M295 647V737" class="recover"/><path d="M800 647V737" class="recover"/><path d="M1295 647V737" class="recover"/>
  <rect x="245" y="744" width="1110" height="55" rx="27" fill="#052e2b" stroke="#34d399"/><text x="800" y="777" text-anchor="middle" class="h">Componente retorna → backlog drenado em ordem → projeção alcança o Ledger</text>
  <rect x="390" y="813" width="820" height="32" rx="16" fill="#064e3b"/><text x="800" y="834" text-anchor="middle" class="m">Sem perda de evento · degradação explícita · recuperação automática</text>
</svg>
